<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đặt cơm trưa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --rice:#FAFBF8; --card:#FFFFFF; --ink:#1C2420; --muted:#5D6962; --line:#DCE3DD;
  --leaf:#235236; --on-leaf:#FFFFFF; --leaf-soft:#E3EEE6; --chili:#C2381F; --bamboo:#F3E6B8; --on-bamboo:#3D3417;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --rice:#111613; --card:#18201B; --ink:#E8EEEA; --muted:#9AA79F; --line:#2B352F;
    --leaf:#82C597; --on-leaf:#0F1A13; --leaf-soft:#1D2B22; --chili:#FF7B5E; --bamboo:#3B3420; --on-bamboo:#F3E6B8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --rice:#111613; --card:#18201B; --ink:#E8EEEA; --muted:#9AA79F; --line:#2B352F;
  --leaf:#82C597; --on-leaf:#0F1A13; --leaf-soft:#1D2B22; --chili:#FF7B5E; --bamboo:#3B3420; --on-bamboo:#F3E6B8;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--rice);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--rice);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{padding:28px 0 8px}
.day{font-size:15px;color:var(--muted);margin:0}
.date{font-size:clamp(40px,11vw,56px);font-weight:800;line-height:1;letter-spacing:-.02em;margin:4px 0 14px}
.clock{display:inline-flex;align-items:center;gap:8px;background:var(--bamboo);color:var(--on-bamboo);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.clock.closed{background:var(--leaf-soft);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--chili)}
.clock.closed .dot{background:var(--muted)}
@media (prefers-reduced-motion:no-preference){.clock:not(.closed) .dot{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--rice);display:flex;gap:4px;padding:14px 0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--leaf-soft);color:var(--ink);font-weight:600}

main{padding:18px 0 140px}
h2{font-size:20px;font-weight:800;margin:28px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}

/* Menu list */
.menu{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.item-name{font-weight:600;font-size:17px;display:flex;align-items:baseline;gap:8px;min-width:0}
.item-name span:first-child{overflow-wrap:anywhere}
.price{color:var(--muted);font-size:15px}
.item.on .item-name{color:var(--leaf)}
.stepper{display:flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:12px;padding:2px}
.item.on .stepper{border-color:var(--leaf)}
.stepper button{width:38px;height:38px;border:0;border-radius:9px;background:none;font-size:22px;line-height:1;cursor:pointer}
.stepper button:hover:not(:disabled){background:var(--leaf-soft)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:22px;text-align:center;font-weight:700}

details.photos{margin:0 0 6px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
details.photos summary{cursor:pointer;padding:12px 14px;font-weight:500}
details.photos img{display:block;width:100%;height:auto;border-top:1px solid var(--line)}

label.field{display:block;font-size:14px;font-weight:500;margin:16px 0 6px}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--leaf)}
textarea{resize:vertical;min-height:72px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--leaf);color:var(--on-leaf)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--leaf)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.link{background:none;color:var(--chili);padding:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-total{font-size:22px;font-weight:800}
.bar-sub{font-size:13px;color:var(--muted);display:block;font-weight:400}

/* Ticket (order + QR) */
.ticket{background:var(--card);border:1.5px solid var(--leaf);border-radius:18px;padding:18px;margin:6px 0 8px}
.ticket h3{margin:0 0 6px;font-size:17px}
.ticket ul{margin:0 0 10px;padding-left:18px}
.qr{display:grid;grid-template-columns:minmax(0,190px) 1fr;gap:18px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
@media (max-width:420px){.qr{grid-template-columns:1fr}}
.qr-box{background:#fff;padding:10px;border-radius:12px;max-width:210px}
.qr-box svg{display:block;width:100%;height:auto}
.qr dl{margin:0;font-size:14px}
.qr dt{color:var(--muted)}
.qr dd{margin:0 0 8px;font-weight:600;overflow-wrap:anywhere}
.amount{font-size:26px;font-weight:800;color:var(--chili)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--leaf-soft);color:var(--leaf)}
.chip.wait{background:var(--bamboo);color:var(--on-bamboo)}
.chip.no{background:transparent;border:1px solid var(--line);color:var(--muted)}

/* Summary */
.stats{display:flex;gap:28px;margin:4px 0 18px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.people{list-style:none;margin:0;padding:0}
.person{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.person small{color:var(--muted);grid-column:1}
.person .r{text-align:right}

/* Admin menu editor */
.edit-row{display:grid;grid-template-columns:1fr 120px 36px;gap:8px;margin-bottom:8px}
.icon-btn{border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);font-size:20px}
.icon-btn:hover{background:var(--leaf-soft);color:var(--chili)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;background:var(--card)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf);font-weight:600}
pre.msg{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:14px;margin:0 0 10px}

.empty{padding:36px 0;text-align:left}
.empty p{color:var(--muted);margin:6px 0 16px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--bamboo);padding:4px 0 4px 12px;margin:14px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--rice);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
[hidden]{display:none!important}
.who{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);padding-top:14px}
.who button{border:0;background:none;color:var(--chili);cursor:pointer;font-weight:500;padding:4px 0}
.photos img{max-height:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="who" id="who" hidden><span id="whoName"></span><button id="signOut">Đăng xuất</button></div>
  <header class="top">
    <p class="day" id="weekday"></p>
    <h1 class="date num" id="date"></h1>
    <div class="clock" id="clock"><span class="dot"></span><span id="clockText">Đang tải…</span></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs" hidden>
    <button class="tab" role="tab" data-tab="order" aria-selected="true">Chọn món</button>
    <button class="tab" role="tab" data-tab="summary" aria-selected="false">Tổng hợp</button>
    <button class="tab" role="tab" data-tab="admin" aria-selected="false" hidden id="adminTab">Menu &amp; cài đặt</button>
  </nav>
  <main id="view"><p class="hint">Đang tải…</p></main>
</div>
<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div><span class="bar-total num" id="barTotal">0đ</span><span class="bar-sub" id="barSub">Chưa chọn món</span></div>
    <button class="btn" id="barBtn">Đặt món</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
